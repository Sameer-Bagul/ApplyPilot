services:
  # Option A: Full Docker Container (Python Engine + Next.js UI + Background Workers + Playwright)
  - type: web
    name: applypilot-app
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: applypilot-data
      mountPath: /home/applypilot/data
      sizeGB: 5
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: START_MARATHON
        value: "false" # Set to true to run 24/7 autonomous job discovery & applying
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: applypilot-app
          property: host
      - key: ALLOWED_EMAILS
        value: sameerbagul2004@gmail.com
      - key: ADMIN_PASSCODE
        sync: false
      - key: APPLYPILOT_DB_PATH
        value: /home/applypilot/data/applypilot.db
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

services:
  # Option A: Full Docker Container (Python Engine + Next.js UI + Background Workers)
  - type: web
    name: applypilot-app
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: START_MARATHON
        value: "false" # Set to true to run 24/7 autonomous job discovery & applying
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: applypilot-app
          property: host
      - key: ALLOWED_EMAILS
        value: sameerbagul2004@gmail.com
      - key: ADMIN_PASSCODE
        sync: false
      - key: TURSO_DATABASE_URL
        value: libsql://applypilot-sameerbagul.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

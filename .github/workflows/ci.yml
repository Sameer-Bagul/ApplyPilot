name: CI/CD Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  python-backend:
    name: Python Backend (Tests & Quality)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ --output-format=github || true

      - name: Run unit test suite
        run: |
          pytest tests/test_metadata_and_matcher.py tests/test_levergreen_and_email_crawler.py -v

  nextjs-dashboard:
    name: Next.js Dashboard (Build & Security Audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: NPM Security Audit
        run: npm audit --audit-level=high

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: "ci-test-secret-for-build-validation-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          ALLOWED_EMAILS: "sameerbagul2004@gmail.com"
          NODE_ENV: "production"

  render-deployment:
    name: Trigger Render Deployment
    needs: [python-backend, nextjs-dashboard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Pinging Render Deploy Hook..."
          curl -s -S -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Deployment triggered successfully on Render!"


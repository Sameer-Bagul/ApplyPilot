name: applypilot

services:
  # ============================================================================
  # 🚀 ALL-IN-ONE UNIFIED STACK (Default)
  # Launches Next.js Dashboard UI (Port 3000), All REST APIs, and background Marathon Looper
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: applypilot:latest
    container_name: applypilot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ENV=production
      - START_MARATHON=true
      - DISPLAY=${DISPLAY:-:1}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
    volumes:
      - ${HOME}/.applypilot:/home/applypilot/.applypilot
      - applypilot_gmail:/home/applypilot/.gmail-mcp
      - ./dashboard:/home/applypilot/app/dashboard
      - ./src:/home/applypilot/app/src
      - ./docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - .:/home/applypilot/data:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["all"]

  # ============================================================================
  # 🛠️ MODULAR SERVICES (Optional / Standalone mode)
  # ============================================================================
  # Standalone CLI utility service (e.g. status, match-jobs, harvest-emails)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: applypilot:latest
    container_name: applypilot-cli
    profiles: ["modular"]
    environment:
      - APPLYPILOT_HEADLESS=false
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY:-:1}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
    volumes:
      - ${HOME}/.applypilot:/home/applypilot/.applypilot
      - applypilot_gmail:/home/applypilot/.gmail-mcp
      - ./dashboard:/home/applypilot/app/dashboard
      - ./src:/home/applypilot/app/src
      - ./docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - .:/home/applypilot/data:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["status"]

  # Standalone Autonomous parallel apply worker daemon
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: applypilot:latest
    container_name: applypilot-worker
    restart: unless-stopped
    profiles: ["modular"]
    environment:
      - APPLYPILOT_HEADLESS=false
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY:-:1}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
    volumes:
      - ${HOME}/.applypilot:/home/applypilot/.applypilot
      - applypilot_gmail:/home/applypilot/.gmail-mcp
      - ./dashboard:/home/applypilot/app/dashboard
      - ./src:/home/applypilot/app/src
      - ./docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - .:/home/applypilot/data:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["apply", "--workers", "2"]

  # Standalone Email HITL reply tracker daemon
  tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: applypilot:latest
    container_name: applypilot-tracker
    restart: unless-stopped
    profiles: ["modular"]
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HOME}/.applypilot:/home/applypilot/.applypilot
      - applypilot_gmail:/home/applypilot/.gmail-mcp
      - ./dashboard:/home/applypilot/app/dashboard
      - ./src:/home/applypilot/app/src
      - ./docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - .:/home/applypilot/data:ro
    command: ["track", "--poll-hitl", "--interval", "60"]

  # FastMCP server for AI agent integrations (e.g. Claude Desktop, Cursor)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: applypilot:latest
    container_name: applypilot-mcp
    restart: unless-stopped
    profiles: ["modular"]
    stdin_open: true
    tty: true
    volumes:
      - ${HOME}/.applypilot:/home/applypilot/.applypilot
      - applypilot_gmail:/home/applypilot/.gmail-mcp
      - ./dashboard:/home/applypilot/app/dashboard
      - ./src:/home/applypilot/app/src
      - ./docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - .:/home/applypilot/data:ro
    command: ["mcp"]

volumes:
  applypilot_gmail:
    name: applypilot_gmail_creds
